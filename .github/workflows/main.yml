name: Backend CI (Node + TypeScript + Jest)

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "tsconfig*.json"
      - "prisma/**"
  pull_request:
    branches: [ main, develop ]

jobs:
  # -----------------------------
  # 🧱 BUILD + PRISMA + TYPE CHECK
  # -----------------------------
  build:
    name: 🧱 Build, Prisma Validate & Type Check
    runs-on: ubuntu-latest
    environment: ENV

    env:
      NODE_ENV: test

      # -----------------
      # 🌐 Environment Variables (non-sensitive)
      # -----------------
      PORT: ${{ vars.PORT }}
      CLIENT_ID: ${{ vars.CLIENT_ID }}
      TENANT_ID: ${{ vars.TENANT_ID }}
      REDIRECT_URI: ${{ vars.REDIRECT_URI }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS }}
      DB_HOST_NAME: ${{ vars.DB_HOST_NAME }}
      DB_PORT: ${{ vars.DB_PORT }}
      VERBOSE_AUTH_LOGS: ${{ vars.VERBOSE_AUTH_LOGS }}
      SECURE_COOKIE: ${{ vars.SECURE_COOKIE }}

      # -----------------
      # 🔐 Sensitive Secrets
      # -----------------
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧩 Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🧠 Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🧮 Type check
        run: npx tsc --noEmit

      - name: 📤 Upload build workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .
          retention-days: 1

  # -----------------------------
  # 🧪 JEST TEST JOB (separate)
  # -----------------------------
  test:
    name: 🧪 Run Jest Tests
    runs-on: ubuntu-latest
    needs: build   # Wait for build job
    environment: ENV

    env:
      NODE_ENV: test

      # 🌐 Environment Variables
      PORT: ${{ vars.PORT }}
      CLIENT_ID: ${{ vars.CLIENT_ID }}
      TENANT_ID: ${{ vars.TENANT_ID }}
      REDIRECT_URI: ${{ vars.REDIRECT_URI }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS }}
      DB_HOST_NAME: ${{ vars.DB_HOST_NAME }}
      DB_PORT: ${{ vars.DB_PORT }}
      VERBOSE_AUTH_LOGS: ${{ vars.VERBOSE_AUTH_LOGS }}
      SECURE_COOKIE: ${{ vars.SECURE_COOKIE }}

      # 🔐 Secrets
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧠 Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🧪 Run Jest tests with coverage
        run: npm test -- --coverage

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: coverage/
